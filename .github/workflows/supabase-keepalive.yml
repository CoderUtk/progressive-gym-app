# Free-tier Supabase projects auto-pause after ~7 days of inactivity.
# Ping the REST API every 3 days so the project stays awake.
# URL + publishable key are the same public values shipped in app.json.
name: supabase-keepalive

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -fsS --retry 3 --retry-delay 10 \
            -H "apikey: sb_publishable_ptyE5I8p0HVrvWCflK4XqQ_4DXdwxn2" \
            "https://bxybxfvhjlzqvapoyzwm.supabase.co/rest/v1/user_data?select=user_id&limit=1"
